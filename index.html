function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function show(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c)).then(function(buf){
  var html=new TextDecoder().decode(buf);
  try{var d=new DOMParser().parseFromString(html,'text/html');
    var old=document.documentElement;document.replaceChild(document.importNode(d.documentElement,true),old);
    var ss=Array.prototype.slice.call(document.querySelectorAll('script'));
    ss.forEach(function(o){var n=document.createElement('script');for(var i=0;i<o.attributes.length;i++){n.setAttribute(o.attributes[i].name,o.attributes[i].value)}
      n.text=o.text;o.parentNode.replaceChild(n,o);});
    window.scrollTo(0,0);
  }catch(err){document.open();document.write(html);document.close();}
});}
function derive(pw){return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(m){
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},m,{name:'AES-GCM',length:256},true,['decrypt']);});}
try{var st=JSON.parse(localStorage.getItem(K)||'null');

}catch(e){}

    return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c)).then(function(){
      return crypto.subtle.exportKey('raw',key).then(function(raw){
        try{if(remember)localStorage.setItem(K,JSON.stringify({k:btoa(String.fromCharCode.apply(null,new Uint8Array(raw))),exp:Date.now()+30*864e5}))}catch(e){}
        return show(key);});});
  }).catch(function(){btn.textContent='Vis rapport';document.getElementById('err').style.display='block';});
});
